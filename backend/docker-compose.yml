services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    env_file: services/auth/.env
    environment:
      PORT: 8001
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  resume:
    build: { context: ., dockerfile: services/resume/Dockerfile }
    env_file: services/resume/.env
    environment:
      PORT: 8002
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  interview:
    build: { context: ., dockerfile: services/interview/Dockerfile }
    env_file: services/interview/.env
    environment:
      PORT: 8003
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  billing:
    build: { context: ., dockerfile: services/billing/Dockerfile }
    env_file: services/billing/.env
    environment:
      PORT: 8004
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  roadmap:
    build: { context: ., dockerfile: services/roadmap/Dockerfile }
    env_file: services/roadmap/.env
    environment:
      PORT: 8005
      REDIS_URL: redis://redis:6379
    depends_on: [redis]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    env_file: gateway/.env
    environment:
      PORT: 8000
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:8001
      RESUME_SERVICE_URL: http://resume:8002
      INTERVIEW_SERVICE_URL: http://interview:8003
      BILLING_SERVICE_URL: http://billing:8004
      ROADMAP_SERVICE_URL: http://roadmap:8005
    ports:
      - "8000:8000"
    depends_on: [auth, resume, interview, billing, roadmap]